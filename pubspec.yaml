name: secondary_screen
description: "A Flutter package for managing Android dual/secondary screen displays with a state-manager-agnostic service API."
version: 2.1.1
homepage: https://github.com/felixdinh/secondary-screen
repository: https://github.com/felixdinh/secondary-screen
topics:
  - dual-screen
  - multi-screen
  - android
  - display
  - presentation

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.felixdinh.secondary_screen
        pluginClass: SecondaryScreenPlugin
