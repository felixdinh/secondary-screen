name: secondary_screen
description: "A Flutter package for managing dual/secondary screen displays with BLoC state management, supporting data transfer and route control."
version: 1.0.0+1
homepage: https://github.com/felixdinh/secondary-screen
repository: https://github.com/felixdinh/secondary-screen

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  presentation_displays: ^1.0.0
  flutter_bloc: ^8.1.3
  carousel_slider: ^5.1.1
  cached_network_image: ^3.4.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true




